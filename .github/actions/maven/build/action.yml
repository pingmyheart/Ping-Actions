name: Maven Build Action

runs:
  using: composite

  steps:
    - name: TestContainer Fix
      shell: bash
      run: |
        echo api.version=1.44 >> ~/.docker-java.properties
    - name: Cache Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: m2-${{ runner.os }}-${{ github.ref_name }}
        restore-keys: |
          m2-${{ runner.os }}-${{ github.ref_name }}-
          m2-${{ runner.os }}-
    - name: Build
      shell: bash
      run: |
        mvn -B clean package
        echo "Maven build completed successfully."
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - name: Collect JaCoCo Reports
      shell: bash
      run: |
        mkdir -p jacoco-results
        find . -type f -name "jacoco.xml" -exec cp --parents {} jacoco-results/ \;
        echo "Collected JaCoCo reports:"
        find jacoco-results -name "jacoco.xml"
    - name: Upload JaCoCo Reports
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-reports
        path: jacoco-results