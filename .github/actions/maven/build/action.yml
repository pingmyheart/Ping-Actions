name: Maven Build Action

runs:
  using: composite

  steps:
    - name: TestContainer Fix
      shell: bash
      run: |
        echo api.version=1.44 >> ~/.docker-java.properties
    - name: Cache Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: m2-${{ runner.os }}-${{ github.ref_name }}
        restore-keys: |
          m2-${{ runner.os }}-${{ github.ref_name }}-
          m2-${{ runner.os }}-
    - name: Build
      shell: bash
      run: |
        mvn -B clean package
        echo "Maven build completed successfully."
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - name: Collect JaCoCo Reports
      shell: bash
      run: |
        DEST="jacoco-reports"
        
        # Find all jacoco.xml files
        find . -type f -name "jacoco.xml" | while read -r file; do
        # Remove leading ./
        rel_path="${file#./}"
        
        # Destination path
        dest_path="$DEST/$rel_path"
        
        # Create destination directory
        mkdir -p "$(dirname "$dest_path")"
        
        # Copy file
        cp "$file" "$dest_path"
        done || true
        echo "Collected JaCoCo reports:"
        find $DEST -name "jacoco.xml" || true
    - name: Upload JaCoCo Reports
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-reports
        path: jacoco-results
        if-no-files-found: ignore